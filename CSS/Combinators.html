2- Child Selector (>)
3- Adjacent Sibling Selector (+)
4- General Sibling Selector (~)  -->

    <div>
      <p>Lorem ipsum dolor sit amet consectetur.</p>
      <p>Lorem ipsum dolor sit amet consectetur.</p>

        <p>Lorem ipsum dolor sit amet consectetur.</p>
      </section>
    </div>
    <p>Lorem ipsum dolor sit amet consectetur.</p>
    <p>Lorem ipsum dolor sit amet consectetur.</p>
