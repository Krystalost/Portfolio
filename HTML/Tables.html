<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <table border="1" width="70%" cellpadding="10" cellspacing="10">
      <thead>
        <tr>
          <th>lorem</th>
          <th>ipsum</th>
          <th>dolor</th>
          <th>sit</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>lorem</td>
          <td>ipsum</td>
          <td>dolor</td>
          <td>sit</td>
        </tr>
        <tr>
          <td>lorem</td>
          <td rowspan="2">ipsum</td>
          <td>dolor</td>
          <td>sit</td>
        </tr>
        <tr>
          <td>lorem</td>
          <td colspan="2">dolor - sit</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
