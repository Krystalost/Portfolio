<!--
HTML Table & Description List Reference:
Grup           | Etiket                  | Acilimi                 | Gorevi
---------------|-------------------------|-------------------------|---------------------------------------------------
Tablo          | tr                      | Table Row               | Tek bir tablo satiri
Tablo          | th                      | Table Header            | Baslik hucresi (varsayilan kalin/ortali)
Tablo          | td                      | Table Data              | Standart veri hucresi
Tablo          | thead / tbody / tfoot   | Table Head/Body/Foot    | Baslik, govde ve alt ozet gruplari
Tablo (Attr)   | scope="col" / "row"     | Header Scope            | th basliginin sutuna mi satira mi ait oldugu
Tanim Listesi  | dl                      | Description List        | Terim-aciklama listesi kapsayicisi
Tanim Listesi  | dt                      | Description Term        | Tanimlanan terim
Tanim Listesi  | dd                      | Description Details     | Terimin aciklamasi
-->
